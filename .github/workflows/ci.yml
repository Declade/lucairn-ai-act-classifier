name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ['18', '20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Build
        run: pnpm build
      - name: Test
        run: pnpm test
      - name: Verify npm tarball
        run: pnpm verify-tarball

  # Negation is advisory only (PRD prd-2026-10-17-ai-act-check-share-and-action.md,
  # Amendment 1): the differential sweep must find 0 changed verdicts against the
  # pre-negation engine, pinned to main cee0381b and checked out in this job.
  negation-sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out the pre-negation reference (cee0381b)
        uses: actions/checkout@v4
        with:
          ref: cee0381bc2c0f0edfaa2cf743eb97791f3f5a1e5
          path: .negation-reference
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Verify the reference revision
        run: test "$(git -C .negation-reference rev-parse HEAD)" = "cee0381bc2c0f0edfaa2cf743eb97791f3f5a1e5"
      - name: Negation sweep (0 changed verdicts vs cee0381b)
        run: pnpm negation:sweep --reference .negation-reference
